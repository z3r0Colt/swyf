name: Build DIALTONE bundled-AI APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Download native inference engine
        run: bash tools/setup_engine.sh
      - name: Download and embed model weights
        run: python3 tools/fetch_model.py
      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon
      - name: Verify model is inside APK
        run: |
          python3 - <<'PY'
          import glob,zipfile
          fn=glob.glob('app/build/outputs/apk/debug/*.apk')[0]
          with zipfile.ZipFile(fn) as z:
            weights=z.getinfo('assets/model.gguf')
            assert weights.file_size > 1_000_000_000, weights.file_size
            print('APK ready:',fn,'bytes=',__import__('os').path.getsize(fn),'model bytes=',weights.file_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DIALTONE-offline-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 7
